    <!-- Only the families the design actually uses: Inter for text, Montserrat for the
         wordmark, JetBrains Mono for code. The stylesheet loads without blocking the
         first paint; until it arrives the system stack below renders. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The hero photograph, preloaded with the same crops the markup asks for,
         so the first screen paints with its image instead of after it. -->
    <link
      rel="preload"
      as="image"
      href="/imges/hero-1-portrait.webp"
      imagesrcset="/imges/hero-1-portrait-sm.webp 450w, /imges/hero-1-portrait.webp 900w"
      imagesizes="100vw"
      media="(max-width: 640px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/imges/hero-1-1920.webp"
      imagesrcset="/imges/hero-1-960.webp 960w, /imges/hero-1-1280.webp 1280w, /imges/hero-1-1920.webp 1920w"
      imagesizes="100vw"
      media="(min-width: 641px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <style>
      body {
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

  </body>
</html>
